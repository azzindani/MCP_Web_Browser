name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Compliance gate — no `mcp` imports under engine/ or shared/
        run: |
          if grep -rE "^(from|import)\s+mcp" engine/ shared/; then
            echo "::error::engine/** and shared/** must not import from mcp.*"
            exit 1
          fi

      - name: Compliance gate — no stdout writes from engine/
        run: |
          # Allow `display.py` (writes to stderr) and tests; flag anything else.
          if grep -rnE "^\s*print\(" engine/ \
              | grep -v "engine/output/display.py" \
              | grep -v "file=sys.stderr"; then
            echo "::error::stray print() in engine/** (must use display.py / stderr)"
            exit 1
          fi

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy engine shared server.py

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Compliance gate — every tool docstring ≤ 80 chars
        run: |
          uv run python - <<'EOF'
          import server
          mgr = server.app._tool_manager
          bad = []
          for tool in mgr.list_tools():
              first = (tool.description or "").strip().splitlines()[0:1]
              line = first[0] if first else ""
              if len(line) > 80:
                  bad.append((tool.name, len(line), line))
          if bad:
              for n, n_chars, line in bad:
                  print(f"::error::{n} docstring is {n_chars} chars: {line!r}")
              raise SystemExit(1)
          print(f"all {len(mgr.list_tools())} tool docstrings within 80-char cap")
          EOF
