name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Cross-platform test matrix ──────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    env:
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      # ── Architecture compliance gates ──
      - name: Compliance — no mcp imports in engine/ or shared/
        shell: bash
        run: |
          if grep -rE "^(from|import)\s+mcp" engine/ shared/; then
            echo "::error::engine/** and shared/** must not import from mcp.*"
            exit 1
          fi

      - name: Compliance — no stdout writes from engine/
        shell: bash
        run: |
          if grep -rnE "^\s*print\(" engine/ \
              | grep -v "engine/output/display.py" \
              | grep -v "engine/cli.py" \
              | grep -v "file=sys.stderr"; then
            echo "::error::stray print() in engine/** (use display.py / stderr)"
            exit 1
          fi

      # ── Linting & static analysis ──
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright engine/ shared/ server.py

      - name: Verify tool docstrings
        run: uv run python tests/verify_tool_docstrings.py

      # ── Tests ──
      - name: Run tests
        run: uv run python -m pytest tests/ -q --tb=short

  # ── Constrained mode (8 GB VRAM target) ─────────────────────────────
  constrained:
    name: Constrained mode (ubuntu)
    runs-on: ubuntu-22.04

    env:
      MCP_CONSTRAINED_MODE: "1"
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests in constrained mode
        run: uv run python -m pytest tests/ -q --tb=short

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        uses: azzindani/MCP_Math/.github/actions/docker-ghcr-publish@main
        with:
          image-name: mcp-web-browser
          push: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  # The suite above never starts a server (STANDARDS.md keeps pytest offline)
  # and the docker job never runs the image it builds, so nothing until now
  # proved that what we ship answers a request. Shared action, because this is
  # identical in all six repos and drift between copies is the bug that keeps
  # costing rounds.
  e2e:
    name: End-to-end (container)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test every tool over HTTP
        uses: azzindani/MCP_Math/.github/actions/e2e-smoke@main
        with:
          port: "8766"
          key-env: WEB_API_KEY
          # Deliberately not the deployed hostname. Rebinding protection is off,
          # so any Host must be accepted; an arbitrary one proves exactly that
          # and keeps the real domain out of one more file.
          public-host: browser.example.com
          mcp-path: /mcp
          health-timeout: "120"
