name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Also build and push the GHCR container image"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ── Cross-platform test gate ────────────────────────────────────────
  ci:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    env:
      MCP_CONSTRAINED_MODE: "1"
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      # ── Quality gates ──
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright engine/ shared/ server.py

      - name: Verify tool docstrings
        run: uv run python tests/verify_tool_docstrings.py

      # ── Tests ──
      - name: Run tests
        run: uv run python -m pytest tests/ -q --tb=short

  # Publishes ghcr.io/<owner>/mcp-web-browser:<version> + :latest. Uses the
  # shared composite action hosted in MCP_Math so the build/push mechanics
  # stay in one place across all azzindani MCP_* repos.
  #
  # Opt-in, not automatic: a tag push cuts the GitHub Release only. The fleet
  # deploys from locally built images, so publishing a package on every tag
  # spends CI minutes on an artefact nothing pulls. To publish one, run this
  # workflow by hand against the tag with publish_image=true. `inputs` is null
  # on a push event, so the condition is false there without a second clause.
  docker:
    name: Publish Docker image (GHCR)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image }}
    needs: ci
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        uses: azzindani/MCP_Math/.github/actions/docker-ghcr-publish@main
        with:
          image-name: mcp-web-browser
          push: "true"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  # ── Publish GitHub Release ──────────────────────────────────────────
  release:
    name: Create Release
    needs: ci
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag name
        id: tag
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)

          if [ -z "$PREV_TAG" ] \
            || [ "$PREV_TAG" = "${{ steps.tag.outputs.version }}" ]; then
            LOG=$(git log --oneline --no-decorate | head -50)
          else
            LOG=$(git log --oneline --no-decorate \
              "${PREV_TAG}..HEAD" | head -50)
          fi

          {
            echo "## What's Changed"
            echo ""
            echo "$LOG" | sed 's/^/- /'
          } > /tmp/changelog.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: ${{ steps.tag.outputs.version }}
          body_path: /tmp/changelog.txt
          draft: false
          prerelease: >-
            ${{
              contains(steps.tag.outputs.version, '-rc')
              || contains(steps.tag.outputs.version, '-beta')
              || contains(steps.tag.outputs.version, '-alpha')
            }}
          generate_release_notes: true
