[project]
name            = "mcp_web_browser"
version         = "0.1.0"
description     = "Self-hosted MCP server for end-to-end web access on local hardware"
readme          = "README.md"
requires-python = "==3.12.*"
license         = { text = "MIT" }
authors         = [{ name = "Afza Azzindani" }]

# Runtime deps. Cap = 7 per STANDARDS §35. Currently 7.
dependencies = [
  "mcp>=1.0",
  "httpx[http2]>=0.27",
  "playwright>=1.45",
  "pydantic>=2.7",
  "pypdf>=4.0",
  "curl_cffi>=0.7",      # TLS fingerprint impersonation (Scrapling-inspired)
  "markdownify>=0.13",   # HTML→Markdown for clean content extraction
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyright>=1.1",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "shared"]

[tool.ruff]
line-length    = 120
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E402", "E501", "F401", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--tb=short"
markers   = [
  "integration: hits real network",
  "e2e: full pipeline tests",
]

[tool.coverage.run]
source = ["engine", "shared"]
omit   = ["tests/*"]

[tool.uv]
required-version = ">=0.5"
