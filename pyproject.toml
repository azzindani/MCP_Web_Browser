[project]
name            = "mcp_web_browser"
version         = "0.1.2"
description     = "Self-hosted MCP server for end-to-end web access on local hardware"
readme          = "README.md"
requires-python = "==3.14.*"
license         = { text = "MIT" }
authors         = [{ name = "Afza Azzindani" }]

# Runtime deps. STANDARDS §35 targets a cap of 7; currently 9 — lxml and
# cssselect were originally dev-only (pytest fixtures), but engine/workers/
# extractor.py (backing the real browse_extract tool) hard-requires them at
# runtime with no fallback. They were missing from every Docker/remote image
# as a result — browse_extract failed with "lxml not installed" on every
# real call, only masked locally because `uv sync` (dev) installs them too.
# Found via remote_smoke_test.sh actually calling the tool, not just
# /health. Per this file's own precedence over STANDARDS.md (see header),
# a broken advertised tool outweighs the dependency-count target here.
dependencies = [
  "mcp>=1.0,<2.0",
  "httpx[http2]>=0.27",
  "playwright>=1.45",
  "pydantic>=2.7",
  "pypdf>=4.0",
  "curl_cffi>=0.7",      # TLS fingerprint impersonation (Scrapling-inspired)
  "markdownify>=0.13",   # HTML→Markdown for clean content extraction
  "lxml>=4.9",           # backs browse_extract's CSS-selector extraction
  "cssselect>=1.2",      # backs browse_extract's CSS-selector extraction
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyright>=1.1",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "shared"]

[tool.ruff]
line-length    = 120
target-version = "py314"
extend-exclude = ["tests/fixtures"]

[tool.ruff.format]
# Lint shared/, never rewrite it. These modules are meant to stay byte-identical
# with their siblings in the other repos, and the formatter forks them silently.
# MCP_File_System lints at line-length 100 and the rest at 120, which is how
# shared/oauth_bridge.py ended up 77 lines different from its twin by pure
# reflow, with nothing in the diff to say no logic had changed -- and how
# shared/counts.py forked on a single f-string within a day of being written.
# CI caught the second one: `ruff format --check` wanted to rewrite the file
# whose whole purpose is being the one copy.
exclude = ["shared/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E402", "E501", "F401", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--tb=short"
markers   = [
  "integration: hits real network",
  "e2e: full pipeline tests",
]

[tool.coverage.run]
source = ["engine", "shared"]
omit   = ["tests/*"]

[tool.uv]
required-version = ">=0.5"
